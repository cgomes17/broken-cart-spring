<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Store – Products</title>
    <link rel="stylesheet" th:href="@{/store.css}">
</head>
<body>
<nav><a th:href="@{/}">Products</a><a th:href="@{/cart}">Cart</a></nav>
<h1>Products</h1>

<form th:action="@{/}" method="get">
    <label for="category">Category</label>
    <select id="category" name="category" onchange="this.form.submit()">
        <option value="">All</option>
        <option th:each="c : ${ {'books', 'kitchen', 'apparel', 'electronics'} }"
                th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
    </select>
</form>

<table>
    <tr><th>Product</th><th>Category</th><th>Details</th><th>Price</th><th></th></tr>
    <tr th:each="p : ${products}">
        <td th:text="${p.name()}"></td>
        <td th:text="${p.category()}"></td>
        <td class="muted">
            <span th:each="a : ${p.attributes()}" th:text="${a.key + ': ' + a.value + ' '}"></span>
        </td>
        <td th:text="${p.price()}"></td>
        <td>
            <form th:action="@{/cart/items}" method="post">
                <input type="hidden" name="sku" th:value="${p.sku()}">
                <button type="submit">Add to cart</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
