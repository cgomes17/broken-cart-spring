server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
  mvc:
    problemdetails:
      enabled: true

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8081}
